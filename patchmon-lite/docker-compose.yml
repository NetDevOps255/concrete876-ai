services:
  backend:
    build: ./backend
    container_name: patchmon-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - patchmon-data:/data
      - ./backend:/app
      - /root/.ssh:/root/.ssh:ro   # mount host SSH keys for agent SSH
    environment:
      - DATABASE_URL=sqlite:////data/patchmon.db
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - PROXMOX_HOST=${PROXMOX_HOST:-}
      - PROXMOX_TOKEN_ID=${PROXMOX_TOKEN_ID:-}
      - PROXMOX_TOKEN_SECRET=${PROXMOX_TOKEN_SECRET:-}
      - PROXMOX_NODE=${PROXMOX_NODE:-pve}
      - SSH_DEFAULT_USER=${SSH_DEFAULT_USER:-root}
    networks:
      - patchmon

  frontend:
    build: ./frontend
    container_name: patchmon-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - patchmon

volumes:
  patchmon-data:

networks:
  patchmon:
    driver: bridge
