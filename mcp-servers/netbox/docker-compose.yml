version: '3.8'

services:
  netbox-mcp-server:
    build: .
    container_name: netbox-mcp-server
    environment:
      - NETBOX_URL=${NETBOX_URL}
      - NETBOX_TOKEN=${NETBOX_TOKEN}
      - NETBOX_SSL_VERIFY=${NETBOX_SSL_VERIFY:-true}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    stdin_open: true
    tty: true
    restart: unless-stopped
    networks:
      - netbox-mcp

networks:
  netbox-mcp:
    driver: bridge
